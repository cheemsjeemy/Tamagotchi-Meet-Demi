[platformio]
# Caches compiled library and framework files globally for this project
build_cache_dir = .pio/build_cache

[env:4d_systems_esp32s3_gen4_r8n16]
platform = espressif32
board = 4d_systems_esp32s3_gen4_r8n16
framework = arduino

# Monitor speed
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
# Combined build flags (the USB CDC flags are vital for S3 serial debugging)
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MSC_ON_BOOT=0
    -D ARDUINO_USB_DFU_ON_BOOT=0

# Cleaned up library dependencies (removed the duplicate U8g2)
lib_deps = 
	adafruit/Adafruit NeoPixel@^1.15.4
	esp32async/ESPAsyncWebServer@^3.10.3
	esp32async/AsyncTCP@^3.4.10
	olikraus/U8g2@^2.35
	olikraus/U8g2@^2.36.18
